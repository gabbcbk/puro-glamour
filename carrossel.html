<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carrossel</title>
    <link rel="stylesheet" href="carrossel.css">
</head>
<body>
    
    <div class="pai-container">
        <div class="carousel">
            <div class="slides">
                <div class="slide"><img src="./imagens/banner01.jpg" alt="slide 1"></div>
                <div class="slide"><img src="./imagens/banner02.jpg" alt="slide 1"></div>
                <div class="slide"><img src="./imagens/banner03.jpg" alt="slide 1"></div>
            </div>
            
            <button id="prev" class="ctrl">  < </button>
            <button id="next" class="ctrl">  > </button>

            <div class="dots" aria-hidden="true"></div>
        </div>
    </div>

    <script src="carrossel.js"></script>
</body>
</html>
